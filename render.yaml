# Render Blueprint - InsightAI Deployment
# https://render.com/docs/blueprint-spec
# Deploy: connect this repo on render.com → New → Blueprint

services:
  - type: web
    name: mlmodels-lab
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: "8000"
